name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WORK_HOURS_MIN: ${{ secrets.VITE_WORK_HOURS_MIN }}
          VITE_WORK_HOURS_MAX: ${{ secrets.VITE_WORK_HOURS_MAX }}
          VITE_REFERENCE_DATE_YEAR: ${{ secrets.VITE_REFERENCE_DATE_YEAR }}
          VITE_REFERENCE_DATE_MONTH: ${{ secrets.VITE_REFERENCE_DATE_MONTH }}
          VITE_REFERENCE_DATE_DAY: ${{ secrets.VITE_REFERENCE_DATE_DAY }}
        run: npm run build

      - name: Encrypt  with StatiCrypt
        env:
          MY_SITE_PASS: ${{ secrets.SITE_PASSWORD }}
        run: 
          npx staticrypt dist/index.html -p "${{ secrets.SITE_PASSWORD }}" -d dist/ --short
      
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub   Pages
        id: deployment
        uses: actions/deploy-pages@v4